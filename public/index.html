<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Setpoint – All-in-One Fitness Tracker</title><meta name="description" content="Setpoint is an all-in-one fitness tracker: plan meals, log food, train and track progress with an AI coach."><meta name="theme-color" content="#5b4bff"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Playfair+Display:wght@600;700&display=swap">
<link rel="stylesheet" href="css/app.css"></head>
<body>
<canvas id="cf"></canvas><div id="toast" role="status" aria-live="polite"></div><div id="award"></div>
<div class="mo" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="rt"><span style="font-size:13px">Rest</span><b id="rtn">0:00</b><button onclick="rAdd(15)">+15s</button><button onclick="rStop()">Skip</button></div>
<div id="app"></div>
<noscript><p style="padding:24px">Setpoint needs JavaScript to run.</p></noscript>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" onerror="window.__sbFail=1"></script>
<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<script src="js/logic.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/train.js"></script>
<script src="js/meals.js"></script>
<script src="js/ai.js"></script>
<script src="js/home.js"></script>
<script src="js/profile.js"></script>
<script>
(function(){
 window.addEventListener("error",e=>{try{console.error("Setpoint error:",e.message)}catch(_){}});
 try{sbInit()}catch(e){console.error(e)}
 go();
 resumeSession().then(()=>{if(S)go()}).catch(()=>{});
 probeAI().then(()=>{if(S&&tab=="coach")go()});
 if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body></html>
